<!--
  CRISPY shared artifact template — "Line Diagram": CRISPY is a line with
  stations, and every phase document opens on the strip map showing which
  stop it is (transit wayfinding: the strip map above a train door).

  Every CRISPY skill (the create-* and iterate-* phase skills:
  research questions through plan) emit a self-contained .html file using
  this skeleton. Inline the ENTIRE <style> block into each generated
  artifact — do not link this file or share a stylesheet. The output must
  render anywhere it is opened or pasted.

  The header IS the rendered YAML frontmatter: the navy .band shows the
  eyebrow (phase + repo) and the .line strip map, <h1> shows the topic
  title, .prompt-box shows the originating ticket text, and .summary cells
  expose status / date / cross-doc links. Downstream skills also read the
  machine <meta name="crispy:*"> tags in <head>; keep those names stable.

  Slot schema and skip rules: see ../SKILL.md
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{PHASE_LABEL}} · {{TOPIC}}</title>

  <!-- Machine-readable metadata. Downstream CRISPY skills parse these — do not rename. -->
  <meta name="crispy:phase" content="{{PHASE}}">
  <meta name="crispy:status" content="{{STATUS}}">
  <meta name="crispy:date" content="{{DATE}}">
  <meta name="crispy:ticket" content="{{TICKET}}">
  <meta name="crispy:topic" content="{{TOPIC}}">
  <meta name="crispy:repo" content="{{REPO}}">
  <meta name="crispy:branch" content="{{BRANCH}}">
  {{META_EXTRA}}

  <style>
    :root {
      --ground: #F5F6F3;
      --ink: #15181C;
      --muted: #5A6068;
      --rule: #D3D6D0;
      --rule-soft: #E4E6E1;
      --code-bg: #E8EAE5;
      --code-bg-deep: #15181C;
      /* The signage band and the one line colour. --line paints strokes and fills; --line-text clears 4.5:1 as text. */
      --band: #1B2A44;
      --band-ink: #E9EDF3;
      --band-muted: #A9B8D2;
      --line: #D9822B;
      --line-text: #9A5512;
      --plate-accent: #F0A35E;
      --ok: #2F6B3F;
      --warn: #B8761F;
      --warn-text: #855C14;
      --bad: #B0413E;
      --max-w-wide: 980px;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #111418; --ink: #E6E8E3; --muted: #9AA1AA;
        --rule: #333941; --rule-soft: #242930; --code-bg: #1F242A;
        --code-bg-deep: #0A0C0F;
        --band: #22385C;
        --line: #E8944A; --line-text: #E8944A; --plate-accent: #9A5512;
        --ok: #6FA46F; --warn: #D29A4A; --warn-text: #D29A4A; --bad: #DA7470;
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--ground); }
    body {
      margin: 0;
      font: 16px/1.65 var(--sans);
      color: var(--ink);
      background: var(--ground);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .page, .band-in { max-width: var(--max-w-wide); margin: 0 auto; padding-inline: 1.75rem; }
    .page { padding-block: 2.5rem 5rem; }

    /* ────────── Masthead band: eyebrow + strip map ────────── */
    .band { background: var(--band); color: var(--band-ink); padding: 1.6rem 0 1.5rem; }
    .band:not(:has(.line)) { padding: 0.9rem 0; }
    .eyebrow {
      font-size: 0.8125rem; color: var(--band-muted); letter-spacing: 0.08em;
      text-transform: uppercase; font-weight: 600;
    }
    .line {
      list-style: none; margin: 1.5rem 0 0; padding: 0; max-width: none;
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    }
    .line li {
      position: relative; margin: 0; padding-top: 2.1rem; text-align: center;
      font-size: 0.8125rem; font-weight: 600; color: var(--band-muted); white-space: nowrap;
    }
    /* Station dot. State is a mark, not a hue: done = filled, here = ringed, upcoming = hollow. */
    .line li::before {
      content: ""; position: absolute; z-index: 1; top: 0.35rem; left: 50%;
      width: 1rem; height: 1rem; margin-left: -0.5rem; border-radius: 50%;
      background: var(--band); border: 3px solid var(--band-muted);
    }
    /* Segment to the next station: solid once travelled, dotted ahead. */
    .line li::after {
      content: ""; position: absolute; top: calc(0.85rem - 2px); left: 50%; width: 100%;
      border-top: 4px dotted var(--line);
    }
    .line li:last-child::after { display: none; }
    /* Even spacing with the end dots on the column edges: widen the list by half a station gap each side. */
    .line { --n: 6; margin-inline: calc(-100% / (2 * (var(--n) - 1))); }
    .line:has(> li:nth-child(3):last-child) { --n: 3; }
    .line:has(> li:nth-child(4):last-child) { --n: 4; }
    .line:has(> li:nth-child(5):last-child) { --n: 5; }
    .line:has(> li:nth-child(7):last-child) { --n: 7; }
    .line:has(> li:nth-child(8):last-child) { --n: 8; }
    .line li:first-child { text-align: left; padding-left: calc(50% - 0.5rem); }
    .line li:last-child { text-align: right; padding-right: calc(50% - 0.5rem); }
    .line li.done::before { background: var(--band-ink); border-color: var(--band-ink); }
    .line li.done::after { border-top: 5px solid var(--line); top: calc(0.85rem - 2.5px); }
    .line li.here { color: #FFFFFF; font-size: 1.25rem; font-weight: 700; padding-top: 1.85rem; line-height: 1.3; }
    .line li.here::before {
      top: 0; width: 1.7rem; height: 1.7rem; margin-left: -0.85rem;
      border: 5px solid #FFFFFF; background: var(--band);
    }

    /* ────────── Header (the rendered frontmatter) ────────── */
    .page-head { margin-bottom: 2.75rem; }
    h1 {
      font-size: 2.5rem; line-height: 1.15; font-weight: 700;
      margin: 0 0 0.9rem; letter-spacing: -0.018em; max-width: 30ch; text-wrap: balance;
    }
    .prompt-box { font-size: 1.0625rem; color: var(--muted); max-width: 68ch; }
    .prompt-box .label { color: var(--ink); font-weight: 600; margin-right: 0.5rem; }

    /* ────────── Summary cells (the rest of the frontmatter) ────────── */
    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.5rem 2rem; margin: 1.6rem 0 0; padding: 0.85rem 0;
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    }
    .summary .k {
      font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin-bottom: 0.1rem;
    }
    .summary .v { font-size: 0.9375rem; font-weight: 600; overflow-wrap: anywhere; }
    .summary .v.accent { color: var(--line-text); }
    .summary .v code { font-size: 0.8125rem; }

    /* ────────── Status badge: a station mark, so it reads in grayscale and print ────────── */
    .badge { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--ink); }
    .badge::before {
      content: ""; flex: none; width: 0.75rem; height: 0.75rem; border-radius: 50%;
      border: 2px solid var(--muted); background: transparent;
    }
    .status-draft::before    { border-style: dashed; border-color: var(--warn); }
    .status-ready::before    { border: 3px solid var(--line); }
    .status-complete::before { border-color: var(--ok); background: var(--ok); }

    /* ────────── Sections: numbers on platform tiles ────────── */
    section { margin: 3.25rem 0; }
    .sec-head { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.85rem; }
    .sec-head .num {
      flex: none; width: 2.25rem; height: 2.25rem; border-radius: 4px;
      background: var(--band); color: #FFFFFF; text-align: center;
      font: 700 0.9375rem/2.25rem var(--sans); font-variant-numeric: tabular-nums;
    }
    h2 { font-size: 1.5rem; line-height: 1.25; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    h3 { font-size: 1.0625rem; font-weight: 700; margin: 1.75rem 0 0.5rem; }
    .sec-intro { color: var(--muted); max-width: 64ch; margin: 0 0 1.25rem; }
    p { margin: 0.5rem 0 0.85rem; max-width: 68ch; }
    strong { font-weight: 650; }

    /* ────────── Inline + block code ────────── */
    code {
      font: 0.875em/1.45 var(--mono);
      background: var(--code-bg); color: var(--ink);
      padding: 0.12em 0.4em; border-radius: 3px;
    }
    pre {
      background: var(--code-bg-deep); color: #E6E8E3;
      border-radius: 6px; padding: 1rem 1.2rem;
      overflow-x: auto; font: 0.8125rem/1.6 var(--mono);
      margin: 0.85rem 0; max-width: 100%;
    }
    pre code { background: transparent; padding: 0; color: inherit; font-size: 1em; }
    pre .kw { color: #F0A35E; }   /* keyword */
    pre .fn { color: #9CC3E6; }   /* function/identifier */
    pre .str { color: #A7C499; }  /* string */
    pre .cm { color: #8A929C; font-style: italic; }  /* comment */
    pre .hl { background: rgba(217,130,43,0.24); padding: 0 0.2em; border-radius: 2px; }
    .file-label {
      font: 600 0.75rem/1.3 var(--mono); color: var(--muted);
      letter-spacing: 0.02em; margin-bottom: 0.4rem;
    }

    /* ────────── Tables ────────── */
    table {
      border-collapse: collapse; width: 100%; margin: 1rem 0;
      font-size: 0.9375rem; font-variant-numeric: tabular-nums;
    }
    th, td {
      border-bottom: 1px solid var(--rule-soft);
      padding: 0.55rem 0.85rem 0.55rem 0; text-align: left; vertical-align: top;
    }
    th {
      font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); font-weight: 700;
      border-bottom: 2px solid var(--ink);
    }

    /* ────────── Cards: a heavy top rule as the label strip, no box ────────── */
    .card, .slice {
      border-top: 2px solid var(--ink); padding: 0.9rem 0 0.25rem; margin: 1.75rem 0;
    }
    .card > h3:first-child, .slice > h3:first-child { margin-top: 0; }
    details {
      border-top: 1px solid var(--rule); padding: 0.65rem 0; margin: 0;
    }
    details:last-of-type { border-bottom: 1px solid var(--rule); }
    summary {
      cursor: pointer; font-weight: 600; list-style: none;
      margin: -0.65rem 0; padding: 0.65rem 0;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: ""; display: inline-block; width: 0; height: 0; margin: 0 0.55rem 0.1rem 0.1rem;
      border-style: solid; border-width: 0.32rem 0 0.32rem 0.45rem;
      border-color: transparent transparent transparent var(--line-text);
      transition: transform 0.15s ease-out;
    }
    details[open] summary::before { transform: rotate(90deg); }
    summary:hover { color: var(--line-text); }
    details[open] summary { margin-bottom: 0.4rem; }
    summary .where { float: right; font: 0.8125rem/1.6 var(--mono); color: var(--muted); }

    /* ────────── Tradeoffs grid (used by create-design-discussion) ────────── */
    .tradeoffs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; margin: 0.75rem 0; }
    .tradeoffs .row { display: contents; }
    .tradeoffs .cell { padding: 0.45rem 0; font-size: 0.9375rem; border-bottom: 1px solid var(--rule-soft); }
    .tradeoffs .row.head .cell {
      font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; border-bottom: 2px solid var(--ink);
    }
    .tradeoffs .cell.pro::before { content: "+ "; color: var(--ok); font-weight: 700; }
    .tradeoffs .cell.con::before { content: "− "; color: var(--bad); font-weight: 700; }

    /* ────────── Option list (contrastive A/B/C) ────────── */
    .options { margin: 0.75rem 0; }
    .option {
      position: relative; padding: 0.6rem 0 0.6rem 2.6rem;
      border-bottom: 1px solid var(--rule-soft);
    }
    .option:first-child { border-top: 1px solid var(--rule-soft); }
    .option .opt-label {
      position: absolute; left: 0; top: 0.6rem; width: 1.75rem; height: 1.75rem;
      border-radius: 4px; border: 2px solid var(--rule); color: var(--muted);
      text-align: center; font: 700 0.875rem/1.45rem var(--sans);
    }
    .option.chosen .opt-label { background: var(--line); border-color: var(--line); color: #1B1206; }
    .option.chosen::after {
      content: "Chosen"; display: block; margin-top: 0.15rem; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--line-text);
    }

    /* ────────── Slice / milestone cards (create-structure-outline, create-plan) ────────── */
    .slice .goal { color: var(--muted); margin-bottom: 0.5rem; }
    .checkpoint {
      display: inline-block; font: 600 0.875rem/1.4 var(--sans);
      background: rgba(63,140,80,0.12); color: var(--ok);
      padding: 0.3rem 0.7rem; border-radius: 4px; margin: 0.35rem 0;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.45rem 0; }
    .tag {
      display: inline-block; font: 600 0.75rem/1.4 var(--mono);
      background: var(--code-bg); color: var(--muted);
      padding: 0.15rem 0.55rem; border-radius: 3px; letter-spacing: 0.02em;
    }
    .tag.new { color: var(--ok); }
    .tag.mod { color: var(--line-text); }
    .tag.del { color: var(--bad); }

    /* ────────── Chips (metric pills) ────────── */
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
    .chip {
      font-size: 0.8125rem; background: var(--code-bg);
      padding: 0.25rem 0.7rem; border-radius: 999px; color: var(--muted);
    }
    .chip strong { color: var(--ink); font-weight: 650; }

    /* ────────── Callouts: an info sign beside the text, no box ────────── */
    .callout {
      position: relative; padding: 0.1rem 0 0.1rem 2.5rem; margin: 1.25rem 0;
      max-width: 68ch; font-size: 0.9375rem;
    }
    .callout::before {
      content: "i"; position: absolute; left: 0; top: 0.1rem;
      width: 1.6rem; height: 1.6rem; border-radius: 4px;
      background: var(--band); color: #FFFFFF; text-align: center;
      font: 700 0.9375rem/1.6rem var(--sans);
    }
    .callout.warn::before { content: "!"; background: var(--warn); color: #1B1206; }
    .callout.bad::before  { content: "!"; background: var(--bad);  color: #FFFFFF; }

    /* ────────── Recommendation: the document's one reversed plate ────────── */
    aside.reco {
      background: var(--ink); color: var(--ground);
      border-radius: 6px; padding: 1.4rem 1.6rem; margin: 2.25rem 0;
    }
    aside.reco h2 { font-size: 1.375rem; line-height: 1.3; color: inherit; margin: 0 0 0.5rem; }
    aside.reco h2::before {
      content: ""; display: inline-block; width: 0.75rem; height: 0.75rem; margin-right: 0.65rem;
      border-radius: 50%; border: 3px solid var(--plate-accent); vertical-align: 0.05em;
    }
    aside.reco p { font-size: 1.0625rem; color: inherit; opacity: 0.86; }
    aside.reco code { background: rgba(127,127,127,0.22); color: inherit; white-space: nowrap; }
    td code { white-space: nowrap; }
    aside.reco a { color: inherit; }

    /* ────────── Diagrams (inline SVG) ────────── */
    figure.diagram { margin: 1.25rem 0; overflow-x: auto; }
    figure.diagram svg { display: block; height: auto; }
    figure.diagram svg:not([width]) { width: 100%; }
    figure.diagram text { fill: var(--ink); font: 0.8125rem var(--sans); }
    figure.diagram .node { fill: var(--code-bg); stroke: var(--rule); stroke-width: 1; }
    figure.diagram .node.accent { stroke: var(--line); stroke-width: 2; }
    figure.diagram .edge { fill: none; stroke: var(--muted); stroke-width: 1.25; }
    figure.diagram .arrow { fill: var(--muted); }
    figure.diagram figcaption { color: var(--muted); font-size: 0.8125rem; margin-top: 0.4rem; }

    /* ────────── Lists ────────── */
    ul, ol { padding-left: 1.4rem; max-width: 68ch; }
    li { margin: 0.2rem 0; }
    blockquote {
      border-left: 3px solid var(--rule); padding: 0.25rem 0 0.25rem 1rem;
      margin: 0.75rem 0; color: var(--muted); max-width: 64ch;
    }
    a { color: var(--line-text); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    a:hover { color: var(--ink); }
    ::selection { background: rgba(217,130,43,0.3); }
    :focus-visible { outline: 2px solid var(--line-text); outline-offset: 2px; border-radius: 2px; }

    /* ────────── Narrow screens: only the current station keeps its label ────────── */
    @media (max-width: 640px) {
      .page, .band-in { padding-inline: 1.15rem; }
      h1 { font-size: 1.875rem; }
      .line li:not(.here) { color: transparent; font-size: 0; }
      .line li.here { font-size: 1rem; }
      table { display: block; overflow-x: auto; }
    }

    /* ────────── Print ────────── */
    @media print {
      html, body { background: white; color: black; }
      .band, .sec-head .num, .callout::before, .option.chosen .opt-label, .checkpoint {
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .page { padding: 1.5rem 0 0; max-width: 100%; }
      details { border: none; padding: 0; }
      details > *:not(summary) { display: block !important; }
      summary::before { display: none; }
      aside.reco { background: none; color: black; border: 2px solid black; }
      aside.reco h2 { color: black; }
      pre { background: #F2F3F0; color: #15181C; border: 1px solid #ccc; }
      pre .kw, pre .fn, pre .str, pre .cm { color: inherit !important; }
    }
  </style>
</head>
<body>
  <header class="band">
    <div class="band-in">
      <div class="eyebrow">{{PHASE_LABEL}} · {{REPO}}</div>
      <ol class="line" aria-label="CRISPY flow">{{LINE}}</ol>
    </div>
  </header>

  <div class="page">

    <header class="page-head">
      <h1>{{TITLE}}</h1>
      <div class="prompt-box">
        <span class="label">{{PROMPT_LABEL}}</span>{{PROMPT_TEXT}}
      </div>
      <div class="summary">
        <div class="cell"><div class="k">Status</div>      <div class="v"><span class="badge status-{{STATUS_CLASS}}">{{STATUS}}</span></div></div>
        <div class="cell"><div class="k">Date</div>        <div class="v">{{DATE}}</div></div>
        <div class="cell"><div class="k">Branch</div>      <div class="v"><code>{{BRANCH}}</code></div></div>
        {{SUMMARY_EXTRA}}
      </div>
    </header>

    {{BODY}}

  </div>
</body>
</html>
